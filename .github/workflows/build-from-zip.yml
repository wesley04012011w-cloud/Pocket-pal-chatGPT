name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          set -e
          shopt -s nullglob
          zips=( "$GITHUB_WORKSPACE"/*.zip )
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Deixe exatamente um ZIP na raiz do repositório."
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          ZIP_PATH="${zips[0]}"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_PATH" -d extracted
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -name package.json -type f -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::package.json não encontrado no ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      - name: Fetch llama.cpp
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          TAG="$(tr -d '\r\n' < llama.cpp.version)"
          if [ "$TAG" != "v0.4.1" ]; then TAG="v0.4.1"; fi
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Create native Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          rm -rf android
          mkdir -p android/app/src/main/java/dev/pocketpal/local
          mkdir -p android/app/src/main/cpp
          mkdir -p android/app/src/main/res/values

          cp native/android/LlamaEngine.cpp android/app/src/main/cpp/LlamaEngine.cpp

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PocketPalLocal"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'dev.pocketpal.local'
              compileSdk 35

              defaultConfig {
                  applicationId 'dev.pocketpal.local'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
                  ndkVersion '27.2.12479018'

                  ndk {
                      abiFilters 'arm64-v8a'
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags '-std=c++17', '-O3', '-DNDEBUG'
                      }
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.31.6'
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android/app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(pocketpal_local LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)

          # Build optimized ARM kernels with runtime CPU-variant dispatch.
          # This avoids illegal-instruction crashes on devices that do not
          # support every newer ARM extension (for example i8mm).
          # Keep the CPU backend statically linked into the APK.
          # Dynamic GGML backends are not automatically packaged by Android Gradle.
          # Use the portable armv8-a baseline to avoid SIGILL on older ARM64 phones.
          set(GGML_NATIVE OFF CACHE BOOL "" FORCE)
          set(GGML_BACKEND_DL OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ALL_VARIANTS OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ARM_ARCH "armv8-a" CACHE STRING "" FORCE)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)

          set(LLAMA_CPP_DIR "${CMAKE_CURRENT_LIST_DIR}/../../../../../llama.cpp")

          set(LLAMA_BUILD_COMMON ON CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TOOLS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_SERVER OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_APP OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_UI OFF CACHE BOOL "" FORCE)
          set(LLAMA_USE_PREBUILT_UI OFF CACHE BOOL "" FORCE)
          set(LLAMA_OPENSSL OFF CACHE BOOL "" FORCE)
          set(LLAMA_CURL OFF CACHE BOOL "" FORCE)
          set(LLAMA_SUBPROCESS OFF CACHE BOOL "" FORCE)

          add_subdirectory("${LLAMA_CPP_DIR}" "${CMAKE_BINARY_DIR}/llama.cpp")

          add_library(pocketpal_local SHARED LlamaEngine.cpp)
          target_include_directories(pocketpal_local PRIVATE
              "${LLAMA_CPP_DIR}/include"
              "${LLAMA_CPP_DIR}/common"
              "${LLAMA_CPP_DIR}/ggml/include"
          )
          target_link_libraries(pocketpal_local PRIVATE llama llama-common log)
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="PocketPal Local"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#09090B</item>
                  <item name="android:navigationBarColor">#09090B</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:colorAccent">#E8E8EA</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/java/dev/pocketpal/local/MarkdownRenderer.java <<'EOF'
package dev.pocketpal.local;

import android.graphics.Typeface;
import android.text.SpannableString;
import android.text.Spanned;
import android.text.style.*;
import android.graphics.Color;
import java.util.regex.*;

public final class MarkdownRenderer {
    private static final int MUTED = Color.rgb(160,160,170);
    private static final int CODE_BG = Color.rgb(28,28,33);

    private MarkdownRenderer() {}

    public static SpannableString render(String src) {
        if (src == null) src = "";
        String normalized = src.replace("\r\n","\n").replace("\r","\n");
        StringBuilder out = new StringBuilder();
        java.util.ArrayList<Mark> marks = new java.util.ArrayList<>();
        String[] lines = normalized.split("\n",-1);
        boolean inCode = false;
        StringBuilder code = new StringBuilder();

        for (String line : lines) {
            if (line.trim().startsWith("```")) {
                if (inCode) {
                    int st = out.length();
                    out.append(code);
                    if (code.length() > 0 && code.charAt(code.length()-1) == '\n') out.setLength(out.length()-1);
                    marks.add(new Mark(st,out.length(),"code"));
                    out.append('\n');
                    code.setLength(0);
                    inCode = false;
                } else {
                    inCode = true;
                    if (out.length() > 0 && out.charAt(out.length()-1) != '\n') out.append('\n');
                }
                continue;
            }
            if (inCode) {
                code.append(line).append('\n');
                continue;
            }
            if (line.matches("^#{1,6}\\s+.*")) {
                int n=0;
                while (n < line.length() && line.charAt(n) == '#') n++;
                int st=out.length();
                out.append(line.substring(n).trim()).append('\n');
                marks.add(new Mark(st,out.length()-1,"h"+n));
                continue;
            }
            if (line.matches("^\\s*>\\s?.*")) {
                int st=out.length();
                out.append("│ ").append(line.replaceFirst("^\\s*>\\s?","")).append('\n');
                marks.add(new Mark(st,out.length()-1,"quote"));
                continue;
            }
            if (line.matches("^\\s*[-*+]\\s+.*") || line.matches("^\\s*\\d+[.)]\\s+.*")) {
                line=line.replaceFirst("^\\s*([-*+]|\\d+[.)])\\s+","• ");
            }
            out.append(line).append('\n');
        }

        if (inCode && code.length() > 0) {
            int st=out.length();
            out.append(code);
            if (code.charAt(code.length()-1) == '\n') out.setLength(out.length()-1);
            marks.add(new Mark(st,out.length(),"code"));
        }
        if (out.length() > 0) out.setLength(out.length()-1);

        SpannableString sp = new SpannableString(out.toString());
        for (Mark m : marks) apply(sp,m);

        Matcher bold=Pattern.compile("\\*\\*(.+?)\\*\\*|__(.+?)__").matcher(sp);
        while (bold.find()) sp.setSpan(new StyleSpan(Typeface.BOLD),bold.start(),bold.end(),Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);

        Matcher italic=Pattern.compile("(?<!\\*)\\*(?!\\*)(.+?)(?<!\\*)\\*(?!\\*)|(?<!_)_(.+?)_").matcher(sp);
        while (italic.find()) sp.setSpan(new StyleSpan(Typeface.ITALIC),italic.start(),italic.end(),Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);

        Matcher inline=Pattern.compile("`([^`]+)`").matcher(sp);
        while (inline.find()) {
            sp.setSpan(new TypefaceSpan(Typeface.MONOSPACE),inline.start(),inline.end(),Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
            sp.setSpan(new BackgroundColorSpan(CODE_BG),inline.start(),inline.end(),Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
        }
        return sp;
    }

    private static void apply(SpannableString sp, Mark m) {
        if (m.end <= m.start) return;
        int f=Spanned.SPAN_EXCLUSIVE_EXCLUSIVE;
        if (m.kind.equals("code")) {
            sp.setSpan(new TypefaceSpan(Typeface.MONOSPACE),m.start,m.end,f);
            sp.setSpan(new BackgroundColorSpan(CODE_BG),m.start,m.end,f);
        } else if (m.kind.equals("quote")) {
            sp.setSpan(new ForegroundColorSpan(MUTED),m.start,m.end,f);
        } else if (m.kind.startsWith("h")) {
            sp.setSpan(new StyleSpan(Typeface.BOLD),m.start,m.end,f);
            int n=Integer.parseInt(m.kind.substring(1));
            sp.setSpan(new RelativeSizeSpan(n<=2?1.28f:1.12f),m.start,m.end,f);
        }
    }

    private static final class Mark {
        final int start,end; final String kind;
        Mark(int s,int e,String k){start=s;end=e;kind=k;}
    }
}
EOF

cat > android/app/src/main/java/dev/pocketpal/local/ThinkingParser.java <<'EOF'
package dev.pocketpal.local;

public final class ThinkingParser {
    public static final class Parts {
        public final String thinking;
        public final String answer;
        public final boolean thinkingActive;

        Parts(String t, String a, boolean active) {
            thinking=t;
            answer=a;
            thinkingActive=active;
        }
    }

    private ThinkingParser() {}

    public static Parts split(String text) {
        if (text == null) text = "";
        int open=text.indexOf("<think>");
        int close=text.indexOf("</think>");
        if (open >= 0) {
            int start=open+7;
            if (close >= start) {
                return new Parts(text.substring(start,close).trim(),
                        text.substring(close+8).trim(),false);
            }
            return new Parts(text.substring(start).trim(),"",true);
        }

        open=text.indexOf("<thinking>");
        close=text.indexOf("</thinking>");
        if (open >= 0) {
            int start=open+10;
            if (close >= start) {
                return new Parts(text.substring(start,close).trim(),
                        text.substring(close+11).trim(),false);
            }
            return new Parts(text.substring(start).trim(),"",true);
        }

        return new Parts("",text,false);
    }
}
EOF

