name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          set -e
          shopt -s nullglob
          zips=( "$GITHUB_WORKSPACE"/*.zip )
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Deixe exatamente um ZIP na raiz do repositório."
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          ZIP_PATH="${zips[0]}"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_PATH" -d extracted
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -name package.json -type f -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::package.json não encontrado no ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      - name: Fetch llama.cpp
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          TAG="$(tr -d '\r\n' < llama.cpp.version)"
          if [ "$TAG" != "v0.4.1" ]; then TAG="v0.4.1"; fi
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Create native Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          rm -rf android
          mkdir -p android/app/src/main/java/dev/pocketpal/local
          mkdir -p android/app/src/main/cpp
          mkdir -p android/app/src/main/res/values

          cp native/android/LlamaEngine.cpp android/app/src/main/cpp/LlamaEngine.cpp

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PocketPalLocal"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'dev.pocketpal.local'
              compileSdk 35

              defaultConfig {
                  applicationId 'dev.pocketpal.local'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
                  ndkVersion '27.2.12479018'

                  ndk {
                      abiFilters 'arm64-v8a'
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags '-std=c++17', '-O3', '-DNDEBUG'
                      }
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.31.6'
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android/app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(pocketpal_local LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)

          # Build optimized ARM kernels with runtime CPU-variant dispatch.
          # This avoids illegal-instruction crashes on devices that do not
          # support every newer ARM extension (for example i8mm).
          # Keep the CPU backend statically linked into the APK.
          # Dynamic GGML backends are not automatically packaged by Android Gradle.
          # Use the portable armv8-a baseline to avoid SIGILL on older ARM64 phones.
          set(GGML_NATIVE OFF CACHE BOOL "" FORCE)
          set(GGML_BACKEND_DL OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ALL_VARIANTS OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ARM_ARCH "armv8-a" CACHE STRING "" FORCE)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)

          set(LLAMA_CPP_DIR "${CMAKE_CURRENT_LIST_DIR}/../../../../../llama.cpp")

          set(LLAMA_BUILD_COMMON ON CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TOOLS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_SERVER OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_APP OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_UI OFF CACHE BOOL "" FORCE)
          set(LLAMA_USE_PREBUILT_UI OFF CACHE BOOL "" FORCE)
          set(LLAMA_OPENSSL OFF CACHE BOOL "" FORCE)
          set(LLAMA_CURL OFF CACHE BOOL "" FORCE)
          set(LLAMA_SUBPROCESS OFF CACHE BOOL "" FORCE)

          add_subdirectory("${LLAMA_CPP_DIR}" "${CMAKE_BINARY_DIR}/llama.cpp")

          add_library(pocketpal_local SHARED LlamaEngine.cpp)
          target_include_directories(pocketpal_local PRIVATE
              "${LLAMA_CPP_DIR}/include"
              "${LLAMA_CPP_DIR}/common"
              "${LLAMA_CPP_DIR}/ggml/include"
          )
          target_link_libraries(pocketpal_local PRIVATE llama llama-common log)
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="PocketPal Local"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#09090B</item>
                  <item name="android:navigationBarColor">#09090B</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:colorAccent">#E8E8EA</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/java/dev/pocketpal/local/MarkdownRenderer.java <<'EOF'
          package dev.pocketpal.local;
          import android.text.Html;
          import android.text.Spanned;
          public final class MarkdownRenderer {
            private MarkdownRenderer(){}
            public static Spanned render(String src){
              if(src==null)src="";
              String[] lines=src.replace("\r","").split("\n",-1);
              StringBuilder h=new StringBuilder(); boolean code=false;
              for(int i=0;i<lines.length;i++){
                String l=lines[i];
                if(l.trim().startsWith("\u0060\u0060\u0060")){code=!code;h.append(code?"<pre>":"</pre>");continue;}
                if(code){h.append(esc(l)).append("\n");continue;}
                if(l.matches("^\\s*#{1,6}\\s+.*")){h.append("<b>").append(inline(l.replaceFirst("^\\s*#{1,6}\\s+",""))).append("</b><br>");}
                else if(l.matches("^\\s*>\\s?.*")){h.append("│ ").append(inline(l.replaceFirst("^\\s*>\\s?",""))).append("<br>");}
                else if(l.matches("^\\s*[-*+]\\s+.*")){h.append("• ").append(inline(l.replaceFirst("^\\s*[-*+]\\s+",""))).append("<br>");}
                else if(l.matches("^\\s*\\d+[.)]\\s+.*")){h.append(inline(l.replaceFirst("^\\s*(\\d+)[.)]\\s+","$1. "))).append("<br>");}
                else {h.append(inline(l));if(i+1<lines.length)h.append("<br>");}
              }
              return Html.fromHtml(h.toString(),Html.FROM_HTML_MODE_LEGACY);
            }
            private static String esc(String s){return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;");}
            private static String inline(String s){
              s=esc(s);
              s=s.replaceAll("\\*\\*(.+?)\\*\\*","<b>$1</b>");
              s=s.replaceAll("__(.+?)__","<b>$1</b>");
              s=s.replaceAll("\u0060([^\u0060]+)\u0060","<font face='monospace'>$1</font>");
              s=s.replaceAll("(?<!\\*)\\*([^*]+)\\*(?!\\*)","<i>$1</i>");
              s=s.replaceAll("(?<!_)_([^_]+)_(?!_)","<i>$1</i>");
              return s;
            }
          }

          EOF

          cat > android/app/src/main/java/dev/pocketpal/local/ThinkingParser.java <<'EOF'
          package dev.pocketpal.local;
          public final class ThinkingParser {
           public static final class Parts{public final String thinking,answer;public final boolean active;Parts(String t,String a,boolean x){thinking=t;answer=a;active=x;}}
           private ThinkingParser(){}
           public static Parts split(String text){
            if(text==null)text="";
            String[][] p={{"<think>","</think>"},{"<thinking>","</thinking>"},{"<|thinking|>","<|end_thinking|>"},{"<|begin_of_thought|>","<|end_of_thought|>"},{"<|begin_of_thinking|>","<|end_of_thinking|>"}};
            for(String[] x:p){int a=text.indexOf(x[0]);if(a>=0){int st=a+x[0].length(),b=text.indexOf(x[1],st);if(b>=0)return new Parts(text.substring(st,b).trim(),text.substring(b+x[1].length()).trim(),false);return new Parts(text.substring(st).trim(),"",true);}}
            return new Parts("",text,false);
           }
          }

          EOF

                    cat > android/app/src/main/java/dev/pocketpal/local/NativeBridge.java <<'EOF'
          package dev.pocketpal.local;
          public final class NativeBridge {
           static{System.loadLibrary("pocketpal_local");}
           private NativeBridge(){}
           public static native boolean nativeLoad(String path,int nctx,int threads,int batchThreads,int batch,boolean flash,boolean mmap,boolean mlock);
           public static native String nativeTemplate();
           public static native void nativeStop();
           public static native void nativeFree();
           public static native boolean nativeGenerateChat(String[] roles,String[] contents,int maxTokens,float temperature,float topP,int topK,float minP,long seed,boolean useJinja,boolean enableThinking,String systemPrompt,TokenCallback callback);
          }
          interface TokenCallback{void emit(String text,boolean done);}

          EOF

          cat > android/app/src/main/java/dev/pocketpal/local/MainActivity.java <<'EOF'
          package dev.pocketpal.local;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              private static final int PICK_MODEL = 7001;

              private final int BG = Color.rgb(9, 9, 11);
              private final int PANEL = Color.rgb(18, 18, 21);
              private final int PANEL_2 = Color.rgb(25, 25, 29);
              private final int TEXT = Color.rgb(241, 241, 243);
              private final int MUTED = Color.rgb(151, 151, 160);

              private LinearLayout root;
              private ScrollView chatScroll;
              private TextView modelStatus, emptyTitle, emptyText, chat, thinking;
              private Button modelButton;
              private EditText input;
              private boolean loaded = false, generating = false;
              private File modelFile;

              private int dp(float v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String value, float size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  return t;
              }

              private android.graphics.drawable.GradientDrawable bg(int color, float radius) {
                  android.graphics.drawable.GradientDrawable d = new android.graphics.drawable.GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(radius));
                  return d;
              }

              private Button button(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(14);
                  b.setTextColor(Color.rgb(15,15,17));
                  b.setAllCaps(false);
                  b.setBackground(bg(Color.rgb(232,232,236), 28));
                  b.setPadding(dp(18), 0, dp(18), 0);
                  return b;
              }

              private TextView iconButton(String symbol) {
                  TextView b = text(symbol, 28, TEXT);
                  b.setGravity(Gravity.CENTER);
                  b.setPadding(dp(8), 0, dp(8), 0);
                  return b;
              }

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  Window w = getWindow();
                  w.setStatusBarColor(BG);
                  w.setNavigationBarColor(BG);
                  w.setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      w.setNavigationBarContrastEnforced(false);
                      w.setStatusBarContrastEnforced(false);
                  }
                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(false);
                  }
                  buildUi();
                  root.post(() -> applySystemBarInsets());
              }

              private void buildUi() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setPadding(dp(18), dp(8), dp(14), dp(8));

                  top.addView(iconButton("☰"), new LinearLayout.LayoutParams(dp(48), dp(48)));
                  TextView title = text("Chat", 25, TEXT);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  top.addView(title, new LinearLayout.LayoutParams(0, dp(56), 1));

                  TextView edit = iconButton("✎");
                  edit.setOnClickListener(v -> newChat());
                  top.addView(edit, new LinearLayout.LayoutParams(dp(52), dp(52)));

                  TextView more = iconButton("⋮");
                  more.setOnClickListener(v -> showSettings());
                  top.addView(more, new LinearLayout.LayoutParams(dp(44), dp(52)));
                  root.addView(top, new LinearLayout.LayoutParams(-1, dp(70)));

                  LinearLayout body = new LinearLayout(this);
                  body.setOrientation(LinearLayout.VERTICAL);
                  body.setGravity(Gravity.CENTER);
                  body.setPadding(dp(22), 0, dp(22), 0);

                  emptyTitle = text("Activate Model To Get Started", 24, TEXT);
                  emptyTitle.setGravity(Gravity.CENTER);
                  body.addView(emptyTitle, new LinearLayout.LayoutParams(-1, dp(42)));

                  emptyText = text("Select the model and load it. After loading, start chatting with your local model.", 17, MUTED);
                  emptyText.setGravity(Gravity.CENTER);
                  emptyText.setLineSpacing(0, 1.12f);
                  LinearLayout.LayoutParams ep = new LinearLayout.LayoutParams(-1, dp(100));
                  ep.topMargin = dp(8);
                  body.addView(emptyText, ep);

                  modelButton = button("Select Model");
                  modelButton.setOnClickListener(v -> pickModel());
                  LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(dp(280), dp(58));
                  bp.gravity = Gravity.CENTER;
                  bp.topMargin = dp(16);
                  body.addView(modelButton, bp);

                  thinking = text("", 14, MUTED);
                  thinking.setGravity(Gravity.TOP | Gravity.START);
                  thinking.setPadding(dp(14), dp(10), dp(14), dp(10));
                  thinking.setBackground(bg(PANEL_2, 16));
                  thinking.setTextIsSelectable(true);
                  thinking.setVisibility(View.GONE);
                  body.addView(thinking, new LinearLayout.LayoutParams(-1, -2));

                  chat = text("", 16, TEXT);
                  chat.setGravity(Gravity.TOP | Gravity.START);
                  chat.setTextIsSelectable(true);
                  chat.setLineSpacing(0, 1.08f);
                  chatScroll = new ScrollView(this);
                  chatScroll.setFillViewport(true);
                  chatScroll.addView(chat, new ScrollView.LayoutParams(-1, -2));
                  chatScroll.setVisibility(View.GONE);
                  body.addView(chatScroll, new LinearLayout.LayoutParams(-1, 0, 1));
                  root.addView(body, new LinearLayout.LayoutParams(-1, 0, 1));

                  LinearLayout composer = new LinearLayout(this);
                  composer.setOrientation(LinearLayout.VERTICAL);
                  composer.setPadding(dp(14), dp(12), dp(14), dp(16));
                  composer.setBackground(bg(PANEL, 26));

                  input = new EditText(this);
                  input.setHint("Type a message...");
                  input.setHintTextColor(Color.rgb(105,105,114));
                  input.setTextColor(TEXT);
                  input.setTextSize(17);
                  input.setSingleLine(false);
                  input.setMinLines(2);
                  input.setMaxLines(5);
                  input.setGravity(Gravity.TOP | Gravity.START);
                  input.setBackgroundColor(Color.TRANSPARENT);
                  composer.addView(input, new LinearLayout.LayoutParams(-1, dp(70)));

                  LinearLayout actions = new LinearLayout(this);
                  actions.setGravity(Gravity.CENTER_VERTICAL);

                  TextView plus = text("+", 30, TEXT);
                  plus.setGravity(Gravity.CENTER);
                  actions.addView(plus, new LinearLayout.LayoutParams(dp(48), dp(42)));

                  TextView up = text("⌃", 25, TEXT);
                  up.setGravity(Gravity.CENTER);
                  up.setBackground(bg(PANEL_2, 24));
                  LinearLayout.LayoutParams upLp = new LinearLayout.LayoutParams(dp(48), dp(42));
                  upLp.leftMargin = dp(4);
                  actions.addView(up, upLp);

                  modelStatus = text("Model not loaded", 12, MUTED);
                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(0, dp(42), 1);
                  sp.leftMargin = dp(10);
                  actions.addView(modelStatus, sp);

                  TextView send = text("➤", 30, TEXT);
                  send.setGravity(Gravity.CENTER);
                  send.setOnClickListener(v -> sendMessage());
                  actions.addView(send, new LinearLayout.LayoutParams(dp(52), dp(42)));

                  composer.addView(actions);
                  root.addView(composer, new LinearLayout.LayoutParams(-1, dp(156)));

                  setContentView(root);
                  applySystemBarInsets();
              }

              private void applySystemBarInsets() {
                  if (root == null) return;
                  root.setOnApplyWindowInsetsListener((v, insets) -> {
                      int t = android.view.WindowInsets.Type.systemBars();
                      android.graphics.Insets bars = insets.getInsets(t);
                      int bottom = bars.bottom;
                      if (android.os.Build.VERSION.SDK_INT >= 30) {
                          android.graphics.Insets ime = insets.getInsets(android.view.WindowInsets.Type.ime());
                          bottom = Math.max(bottom, ime.bottom);
                      }
                      v.setPadding(v.getPaddingLeft(), bars.top, v.getPaddingRight(), bottom);
                      return insets;
                  });
                  root.requestApplyInsets();
              }

              private void pickModel() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  startActivityForResult(i, PICK_MODEL);
              }

              @Override protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (request != PICK_MODEL || result != RESULT_OK || data == null || data.getData() == null) return;
                  Uri uri = data.getData();
                  new Thread(() -> {
                      try {
                          File dir = new File(getFilesDir(), "models");
                          if (!dir.exists()) dir.mkdirs();
                          String name = queryName(uri);
                          if (name == null || name.isEmpty()) name = "model.gguf";
                          name = name.replaceAll("[^A-Za-z0-9._-]", "_");
                          modelFile = new File(dir, name);
                          try (InputStream in = getContentResolver().openInputStream(uri);
                               FileOutputStream out = new FileOutputStream(modelFile)) {
                              if (in == null) throw new IllegalStateException("Não foi possível abrir o modelo");
                              byte[] buf = new byte[1024 * 1024];
                              int n;
                              while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                          }
                          runOnUiThread(this::loadModel);
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(this, "Importação falhou: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }).start();
              }

              private String queryName(Uri uri) {
                  try (android.database.Cursor c = getContentResolver().query(uri, null, null, null, null)) {
                      if (c != null) {
                          int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0 && c.moveToFirst()) return c.getString(idx);
                      }
                  } catch (Exception ignored) {}
                  return uri.getLastPathSegment();
              }

              private void loadModel() {
                  if (modelFile == null) return;
                  modelButton.setText("Loading model…");
                  modelButton.setEnabled(false);
                  modelStatus.setText("Loading " + modelFile.getName() + "…");
                  new Thread(() -> {
                      boolean ok = NativeBridge.nativeLoad(
                              modelFile.getAbsolutePath(), 8192, 4, 8, 512,
                              true, true, false);
                      runOnUiThread(() -> {
                          loaded = ok;
                          modelButton.setEnabled(true);
                          modelButton.setText(ok ? "Model Loaded" : "Select Model");
                          modelStatus.setText(ok ? modelFile.getName() : "Model load failed");
                          emptyTitle.setText(ok ? "Ready" : "Activate Model To Get Started");
                          emptyText.setText(ok ? "Your model is loaded locally. Type a message below." : "Select the model and load it. After loading, start chatting with your local model.");
                      });
                  }, "model-loader").start();
              }

              private void sendMessage() {
                  if (!loaded || generating) {
                      if (!loaded) Toast.makeText(this, "Carregue um modelo primeiro.", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  String prompt = input.getText().toString().trim();
                  if (prompt.isEmpty()) return;
                  input.setText("");
                  generating = true;
                  chatScroll.setVisibility(View.VISIBLE);
                  emptyTitle.setVisibility(View.GONE);
                  emptyText.setVisibility(View.GONE);
                  modelButton.setVisibility(View.GONE);
                  String previous = chat.getText().toString();
                  String header = previous.isEmpty() ? "" : previous + "\n\n";
                  chat.setText(header + "You\n" + prompt + "\n\nAssistant\n");
                  String[] roles = new String[]{"user"};
                  String[] contents = new String[]{prompt};
                  final StringBuilder answer = new StringBuilder();
                  new Thread(() -> {
                      boolean ok = NativeBridge.nativeGenerateChat(
                              roles, contents, maxTokens, temperature, topP, topK, minP, seed,
                              useJinja, enableThinking, systemPrompt,
                              (piece, done) -> {
                                  if (piece != null && !piece.isEmpty()) answer.append(piece);
                                  runOnUiThread(() -> {
                                      ThinkingParser.Parts parts = ThinkingParser.split(answer.toString());
                                      if(parts.thinking.isEmpty()) thinking.setVisibility(View.GONE);
                                      else { SpannableStringBuilder tb=new SpannableStringBuilder("🧠  Thinking\n\n"); tb.append(MarkdownRenderer.render(parts.thinking)); thinking.setText(tb); thinking.setVisibility(View.VISIBLE); }
                                      SpannableStringBuilder cb=new SpannableStringBuilder(); cb.append(header).append("You\n").append(MarkdownRenderer.render(prompt)).append("\n\nAssistant\n").append(MarkdownRenderer.render(parts.answer)); chat.setText(cb);
                                      if (shouldAutoScroll()) chatScroll.post(() -> chatScroll.fullScroll(View.FOCUS_DOWN));
                                  });
                                  if (done) runOnUiThread(() -> generating = false);
                              });
                      if (!ok) runOnUiThread(() -> {
                          generating = false;
                          chatScroll.setVisibility(View.VISIBLE);
                          emptyTitle.setVisibility(View.GONE);
                          emptyText.setVisibility(View.GONE);
                          modelButton.setVisibility(View.GONE);
                          chat.append("\n[Native inference error]");
                      });
                  }, "llama-generate").start();
              }

              private boolean shouldAutoScroll() {
                  int diff = chatScroll.getChildAt(0).getBottom() - (chatScroll.getHeight() + chatScroll.getScrollY());
                  return diff < dp(96);
              }

              private void newChat() {
                  chat.setText("");
                  thinking.setText("");
                  thinking.setVisibility(View.GONE);
                  input.setText("");
                  chatScroll.setVisibility(View.GONE);
                  emptyTitle.setVisibility(View.VISIBLE);
                  emptyText.setVisibility(View.VISIBLE);
                  modelButton.setVisibility(View.VISIBLE);
                  emptyTitle.setText(loaded ? "Ready" : "Activate Model To Get Started");
                  emptyText.setText(loaded ? "Your model is loaded locally. Type a message below." : "Select the model and load it. After loading, start chatting with your local model.");
              }

              private void showSettings() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(20), dp(8), dp(20), dp(8));

                  EditText ctx = new EditText(this);
                  ctx.setHint("Context (default 8192)");
                  ctx.setInputType(2);
                  box.addView(ctx);

                  EditText threads = new EditText(this);
                  threads.setHint("CPU threads (default 6)");
                  threads.setInputType(2);
                  box.addView(threads);

                  EditText tokens = new EditText(this);
                  tokens.setHint("Max output tokens (default 1024)");
                  tokens.setInputType(2);
                  box.addView(tokens);

                  new AlertDialog.Builder(this)
                          .setTitle("Local model settings")
                          .setView(box)
                          .setPositiveButton("Apply", (d, which) -> Toast.makeText(this, "Settings UI pronta; controles avançados entram na próxima etapa.", Toast.LENGTH_SHORT).show())
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              @Override protected void onDestroy() {
                  super.onDestroy();
                  if (generating) NativeBridge.nativeStop();
                  NativeBridge.nativeFree();
              }
          }
