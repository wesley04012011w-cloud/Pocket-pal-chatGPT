name: Build Android from project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and validate project ZIP
        run: |
          set -e
          shopt -s nullglob
          zips=( "$GITHUB_WORKSPACE"/*.zip )
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::Nenhum .zip encontrado na raiz do repositório."
            exit 1
          fi
          if [ "${#zips[@]}" -gt 1 ]; then
            echo "::error::Mais de um .zip encontrado na raiz. Deixe apenas o ZIP do projeto."
            printf 'Encontrados:\n'
            printf ' - %s\n' "${zips[@]}"
            exit 1
          fi
          ZIP_PATH="${zips[0]}"
          ZIP_NAME="$(basename "$ZIP_PATH")"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "Usando: $ZIP_NAME"
          unzip -t "$ZIP_PATH"

      - name: Extract project
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_PATH" -d extracted
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -name package.json -type f -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::O ZIP não contém um package.json de projeto."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Patch llama.cpp 0.4.x native compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native/android/LlamaEngine.cpp")
          s = p.read_text()
          old = "    mp.use_mmap = mmap;\n    mp.use_mlock = mlock;"
          new = "    mp.load_mode = mmap ? (mlock ? LLAMA_LOAD_MODE_MMAP_MLOCK : LLAMA_LOAD_MODE_MMAP)\n                         : (mlock ? LLAMA_LOAD_MODE_MLOCK : LLAMA_LOAD_MODE_NONE);"
          if old in s:
              s = s.replace(old, new)
          # Use llama.cpp's common tokenizer helper instead of depending on the
          # signed return-value convention directly.
          s = s.replace('#include "chat.h"', '#include "chat.h"\n#include "common.h"')
          old_decode = '''static bool decode_prompt(const std::string &prompt, std::vector<llama_token> &tokens) {
              const llama_vocab *vocab = llama_model_get_vocab(g_model);
              const int32_t required = llama_tokenize(vocab, prompt.c_str(), (int32_t)prompt.size(),
                                                       nullptr, 0, true, true);
              if (required >= 0) return false;
              const int32_t n = -required;
              if (n <= 0) return false;
              tokens.resize((size_t)n);
              const int32_t got = llama_tokenize(vocab, prompt.c_str(), (int32_t)prompt.size(),
                                                 tokens.data(), n, true, true);
              return got == n;
          }'''
          new_decode = '''static bool decode_prompt(const std::string & prompt, std::vector<llama_token> & tokens) {
              const llama_vocab * vocab = llama_model_get_vocab(g_model);
              if (!vocab || prompt.empty()) return false;
              tokens = common_tokenize(vocab, prompt, true, true);
              return !tokens.empty();
          }'''
          if old_decode not in s:
              raise SystemExit("decode_prompt function shape not found in project ZIP")
          s = s.replace(old_decode, new_decode)
          s = s.replace('cp.n_batch = (uint32_t)batch;',
                        'cp.n_batch = std::max<uint32_t>((uint32_t)batch, 2048u);')
          s = s.replace('render_chat(msgs, true, true)', 'render_chat(msgs, true, false)')
          p.write_text(s)
          PY
      - name: Patch Android native linker
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native/android/CMakeLists.txt")
          s = p.read_text()
          old = "target_link_libraries(pocketpal_local PRIVATE llama llama-common)"
          new = "target_link_libraries(pocketpal_local PRIVATE llama llama-common log)"
          if old not in s:
              raise SystemExit("Expected target_link_libraries line not found")
          p.write_text(s.replace(old, new))
          PY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado em $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      - name: Fetch llama.cpp
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          TAG="$(tr -d '\r\n' < llama.cpp.version)"
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Prepare Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run android:prepare

      - name: Force Java Capacitor native bridge and Android insets
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          APP=android/app/src/main
          PKG=dev/pocketpal/local
          mkdir -p "$APP/java/$PKG"

          # Capacitor's Android template is Java by default. The previous project
          # wrote .kt files, which can be left out when Kotlin is not enabled.
          # Keep the native bridge in Java so the plugin is definitely packaged.
          rm -f "$APP/java/$PKG/MainActivity.kt" "$APP/java/$PKG/LocalLlamaPlugin.kt" "$APP/java/$PKG/NativeBridge.kt"

          cat > "$APP/java/$PKG/NativeBridge.java" <<'JAVA'
          package dev.pocketpal.local;
          
          public final class NativeBridge {
              static { System.loadLibrary("pocketpal_local"); }
              private NativeBridge() {}
          
              public static native boolean nativeLoad(String path, int nctx, int threads, int batchThreads, int batch,
                                                      boolean flash, boolean mmap, boolean mlock);
              public static native String nativeTemplate();
              public static native void nativeStop();
              public static native void nativeFree();
              public static native boolean nativeGenerateChat(String[] roles, String[] contents, int maxTokens,
                                                              float temperature, float topP, int topK, float minP,
                                                              long seed, TokenCallback callback);
          }
          
          interface TokenCallback {
              void emit(String text, boolean done);
          }
          JAVA

          cat > "$APP/java/$PKG/LocalLlamaPlugin.java" <<'JAVA'
          package dev.pocketpal.local;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          
          import androidx.annotation.NonNull;
          
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          
          import java.io.File;
          
          @CapacitorPlugin(name = "LlamaEngine")
          public class LocalLlamaPlugin extends Plugin {
              @PluginMethod
              public void pickModel(PluginCall call) {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("application/octet-stream");
                  startActivityForResult(call, intent, "modelPicker");
              }
          
              @ActivityCallback
              public void modelPicker(PluginCall call, ActivityResult result) {
                  if (result.getResultCode() != Activity.RESULT_OK) {
                      call.reject("Picker cancelled");
                      return;
                  }
                  Uri uri = result.getData() != null ? result.getData().getData() : null;
                  if (uri == null) {
                      call.reject("No file selected");
                      return;
                  }
                  try {
                      String name = queryName(uri);
                      if (name == null || name.isEmpty()) name = "model.gguf";
                      String safe = name.replaceAll("[^A-Za-z0-9._-]", "_");
                      File dst = new File(getContext().getFilesDir(), "models/" + safe);
                      File parent = dst.getParentFile();
                      if (parent != null) parent.mkdirs();
                      try (java.io.InputStream input = getContext().getContentResolver().openInputStream(uri);
                           java.io.OutputStream output = new java.io.FileOutputStream(dst)) {
                          if (input == null) throw new IllegalStateException("Unable to open selected file");
                          byte[] buffer = new byte[1024 * 1024];
                          int n;
                          while ((n = input.read(buffer)) >= 0) {
                              if (n > 0) output.write(buffer, 0, n);
                          }
                      }
                      call.resolve(new JSObject()
                              .put("path", dst.getAbsolutePath())
                              .put("name", safe)
                              .put("size", dst.length()));
                  } catch (Exception e) {
                      call.reject("Failed to import model", e);
                  }
              }
          
              private String queryName(Uri uri) {
                  try (android.database.Cursor c = getContext().getContentResolver().query(uri, null, null, null, null)) {
                      if (c != null) {
                          int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0 && c.moveToFirst()) return c.getString(idx);
                      }
                  }
                  return uri.getLastPathSegment();
              }
          
              @PluginMethod
              public void loadModel(PluginCall call) {
                  String path = call.getString("path");
                  JSObject settings = call.getObject("settings");
                  if (path == null) { call.reject("Missing path"); return; }
                  if (settings == null) { call.reject("Missing settings"); return; }
                  boolean ok = NativeBridge.nativeLoad(
                          path,
                          settings.optInt("context", 8192),
                          settings.optInt("threads", Math.min(Runtime.getRuntime().availableProcessors(), 8)),
                          settings.optInt("batchThreads", Math.min(Runtime.getRuntime().availableProcessors(), 8)),
                          settings.optInt("batch", 512),
                          settings.optBoolean("flashAttention", true),
                          settings.optBoolean("mmap", true),
                          settings.optBoolean("mlock", false));
                  String template = ok ? NativeBridge.nativeTemplate() : "";
                  call.resolve(new JSObject()
                          .put("ok", ok)
                          .put("template", template)
                          .put("description", "llama.cpp native engine"));
              }
          
              @PluginMethod
              public void generate(PluginCall call) {
                  JSArray messages = call.getArray("messages");
                  JSObject settings = call.getObject("settings");
                  if (messages == null) { call.reject("Missing messages"); return; }
                  if (settings == null) { call.reject("Missing settings"); return; }
                  try {
                      final String[] roles = new String[messages.length()];
                      final String[] contents = new String[messages.length()];
                      for (int i = 0; i < messages.length(); i++) {
                          JSObject m = JSObject.fromJSONObject(messages.getJSONObject(i));
                          roles[i] = m.getString("role");
                          contents[i] = m.getString("content");
                      }
                      Thread t = new Thread(() -> {
                          boolean ok = NativeBridge.nativeGenerateChat(
                                  roles,
                                  contents,
                                  settings.optInt("maxTokens", 1024),
                                  (float) settings.optDouble("temperature", 0.7),
                                  (float) settings.optDouble("topP", 0.95),
                                  settings.optInt("topK", 40),
                                  (float) settings.optDouble("minP", 0.05),
                                  settings.optLong("seed", -1L),
                                  (text, done) -> notifyListeners("token", new JSObject().put("text", text).put("done", done)));
                          if (!ok) {
                              notifyListeners("token", new JSObject().put("text", "\\n\\n[Native inference error]").put("done", true));
                          }
                          call.resolve(new JSObject().put("ok", ok));
                      }, "llama-generate");
                      t.start();
                  } catch (Exception e) {
                      call.reject("Invalid generation request", e);
                  }
              }
          
              @PluginMethod
              public void stop(PluginCall call) {
                  NativeBridge.nativeStop();
                  call.resolve(new JSObject().put("ok", true));
              }
          
              @PluginMethod
              public void unload(PluginCall call) {
                  NativeBridge.nativeFree();
                  call.resolve(new JSObject().put("ok", true));
              }
          
              @PluginMethod
              public void getCapabilities(PluginCall call) {
                  call.resolve(new JSObject()
                          .put("mmap", true)
                          .put("mlock", true)
                          .put("gpu", false)
                          .put("jinja", true));
              }
          }
          JAVA

          cat > "$APP/java/$PKG/MainActivity.java" <<'JAVA'
          package dev.pocketpal.local;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;

          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(LocalLlamaPlugin.class);
                  super.onCreate(savedInstanceState);

                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      getWindow().setNavigationBarContrastEnforced(false);
                  }

                  WindowInsetsControllerCompat controller =
                          WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  controller.setAppearanceLightStatusBars(false);
                  controller.setAppearanceLightNavigationBars(false);
                  controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

                  if (bridge != null && bridge.getWebView() != null) {
                      View webView = bridge.getWebView();
                      webView.setFocusableInTouchMode(true);

                      ViewCompat.setOnApplyWindowInsetsListener(webView, (v, insets) -> {
                          Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                          Insets bars = insets.getInsets(
                                  WindowInsetsCompat.Type.systemBars()
                                          | WindowInsetsCompat.Type.displayCutout());
                          int bottom = Math.max(ime.bottom, bars.bottom);
                          v.setPadding(bars.left, bars.top, bars.right,
                                  insets.isVisible(WindowInsetsCompat.Type.ime()) ? bottom : 0);
                          return insets;
                      });

                      ViewCompat.requestApplyInsets(webView);
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      webView.postDelayed(
                              () -> controller.hide(WindowInsetsCompat.Type.systemBars()), 350);
                  }
              }
          }
          JAVA

          # Make the web UI resilient too, especially on devices where WebView reports safe-area insets.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/styles.css")
          s = p.read_text()
          s = s.replace("body{margin:0;min-width:320px;background:#09090b}", "body{margin:0;min-width:320px;background:#09090b;overflow:hidden}")
          s = s.replace(".app-shell{height:100dvh;", ".app-shell{height:100dvh;min-height:100dvh;")
          s = s.replace("padding:18px clamp(14px,7vw,100px) 24px", "padding:18px clamp(14px,7vw,100px) calc(24px + env(safe-area-inset-bottom, 0px))")
          p.write_text(s)
          PY

          # Android 15+/IME: ensure the generated activity receives keyboard insets.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          if p.exists():
              s = p.read_text()
              pat = r'(<activity[^>]*android:name="[^"]*MainActivity"[^>]*)(>)'
              def add_resize(m):
                  if 'windowSoftInputMode=' in m.group(1):
                      return m.group(0)
                  return m.group(1) + ' android:windowSoftInputMode="adjustResize"' + m.group(2)
              s = re.sub(pat, add_resize, s, count=1)
              p.write_text(s)
          PY

          # Defensive WebView fix for the current broken Jinja/template overlay.
          # It clears a template accidentally placed into the message editor and
          # hides only the bottom template-preview panel, leaving the real input active.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          if p.exists():
              s = p.read_text()
              script = r'''
          <script>
          (() => {
            const templateLike = v => typeof v === 'string' &&
              v.length > 80 && (v.includes('{%-') || v.includes('{%')) &&
              (v.includes('message.content') || v.includes('add_generation_prompt'));
            const fix = () => {
              document.querySelectorAll('textarea,input,[contenteditable="true"]').forEach(el => {
                const value = 'value' in el ? el.value : el.textContent;
                if (templateLike(value)) {
                  if ('value' in el) {
                    el.value = '';
                    el.dispatchEvent(new Event('input', { bubbles: true }));
                  } else {
                    el.textContent = '';
                  }
                }
                el.style.pointerEvents = 'auto';
                el.style.touchAction = 'manipulation';
                el.style.zIndex = '1000';
              });
              document.querySelectorAll('*').forEach(el => {
                if (el.children.length > 8) return;
                const t = (el.textContent || '').trim();
                if (templateLike(t) && /jinja/i.test(t)) {
                  const r = el.getBoundingClientRect();
                  if (r.bottom > innerHeight * 0.55) el.style.display = 'none';
                }
              });
            };
            const boot = () => {
              fix();
              new MutationObserver(fix).observe(document.documentElement, {
                childList: true, subtree: true, characterData: true
              });
              if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                  fix();
                  const active = document.activeElement;
                  if (active && /^(TEXTAREA|INPUT)$/.test(active.tagName)) {
                    setTimeout(() => active.scrollIntoView({block:'nearest'}), 50);
                  }
                });
              }
            };
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', boot, {once:true});
            } else boot();
          })();
          </script>
          '''
              if '</body>' in s and 'Defensive WebView fix for the current broken Jinja/template overlay' not in s:
                  s = s.replace('</body>', script + '\n</body>')
                  p.write_text(s)
          PY

          # Fail early if the bridge/plugin is not actually present in the Android source set.
          test -f "$APP/java/$PKG/MainActivity.java"
          test -f "$APP/java/$PKG/LocalLlamaPlugin.java"
          test -f "$APP/java/$PKG/NativeBridge.java"
          grep -q '@CapacitorPlugin(name = "LlamaEngine")' "$APP/java/$PKG/LocalLlamaPlugin.java"

      - name: Build web and sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-local-llm-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

