      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-local-native-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
