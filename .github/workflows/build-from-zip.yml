          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/cpp/LlamaEngine.cpp")
          s = p.read_text()
          s = s.replace('#include "chat.h"', '#include "chat.h"\n#include "common.h"')
          s = s.replace('mp.use_mmap = mmap;\n    mp.use_mlock = mlock;',
                        'mp.load_mode = mmap ? (mlock ? LLAMA_LOAD_MODE_MMAP_MLOCK : LLAMA_LOAD_MODE_MMAP)\n                         : (mlock ? LLAMA_LOAD_MODE_MLOCK : LLAMA_LOAD_MODE_NONE);')
          pat = r'static bool decode_prompt\s*\([^)]*\)\s*\{.*?\n\}'
          repl = '''static bool decode_prompt(const std::string & prompt, std::vector<llama_token> & tokens) {
              const llama_vocab * vocab = llama_model_get_vocab(g_model);
              if (!vocab || prompt.empty()) return false;
              tokens = common_tokenize(vocab, prompt, true, true);
              return !tokens.empty();
          }'''
          s, n = re.subn(pat, repl, s, count=1, flags=re.S)
          if n != 1: raise SystemExit("decode_prompt not found")
          s = s.replace('cp.n_batch = (uint32_t)batch;', 'cp.n_batch = (uint32_t)batch;')
          s = s.replace('render_chat(msgs, true, true)', 'render_chat(msgs, true, false)')
          s = s.replace('llama_sampler_init_dist((uint32_t)seed)', 'llama_sampler_init_dist(seed < 0 ? LLAMA_DEFAULT_SEED : (uint32_t)seed)')
          p.write_text(s)
          PY

          cat > android/README.md <<'EOF'
