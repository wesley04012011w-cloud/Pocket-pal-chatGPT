name: Build VYRA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "web/**"
      - "native/capacitor/**"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply VYRA Android icon
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/vyra_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="128" android:viewportHeight="128">
              <path android:fillColor="#FFFFFFFF" android:pathData="M20,40.5 L48.7,20 A17,17 0,0 1,68.9,20.4 L108.3,49.2 A17,17 0,0 1,115,62.8 L115,84.2 L82.2,63.5 L45.6,91.1 L20,75.3 Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M19.8,40.5 L51.2,18 A16.8,16.8 0,0 1,70.4,18 L108.1,45.4 L94.4,55.3 L61.7,31.7 A4.6,4.6 0,0 0,56.3,31.6 L30.4,50.8 Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M20,75.2 L45.8,91 L84.3,61.8 L98,71.7 L59.2,101.3 A16.8,16.8 0,0 1,39.1,101.5 L20,91 Z"/>
              <path android:fillColor="#FF000000" android:pathData="M64,43 L67.8,56.2 L81,60 L67.8,63.8 L64,77 L60.2,63.8 L47,60 L60.2,56.2 Z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          import re
          s=re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/vyra_logo"', s, count=1)
          s=re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/vyra_logo"', s, count=1)
          p.write_text(s)
          PY

      - name: Configure Android SDK
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      - name: Fetch llama.cpp
        run: |
          set -e
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Inject native engine and diagnostics
        run: |
          set -e
          mkdir -p android/app/src/main/java/dev/pocketpal/local
          mkdir -p android/app/src/main/cpp

          cp native/capacitor/MainActivity.java android/app/src/main/java/dev/pocketpal/local/MainActivity.java
          cp native/capacitor/Diagnostic.java android/app/src/main/java/dev/pocketpal/local/Diagnostic.java
          cp native/capacitor/NativeBridge.java android/app/src/main/java/dev/pocketpal/local/NativeBridge.java
          cp native/capacitor/LlamaPlugin.java android/app/src/main/java/dev/pocketpal/local/LlamaPlugin.java
          cp native/capacitor/LlamaEngine.cpp android/app/src/main/cpp/LlamaEngine.cpp

          cat > android/app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(pocketpal_local LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)

          set(GGML_NATIVE OFF CACHE BOOL "" FORCE)
          set(GGML_BACKEND_DL OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ALL_VARIANTS OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ARM_ARCH "armv8-a" CACHE STRING "" FORCE)
          set(GGML_CPU_KLEIDIAI ON CACHE BOOL "" FORCE)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)

          set(LLAMA_CPP_DIR "${CMAKE_CURRENT_LIST_DIR}/../../../../../llama.cpp")
          set(LLAMA_BUILD_COMMON ON CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TOOLS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_SERVER OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_APP OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_UI OFF CACHE BOOL "" FORCE)
          set(LLAMA_USE_PREBUILT_UI OFF CACHE BOOL "" FORCE)
          set(LLAMA_OPENSSL OFF CACHE BOOL "" FORCE)
          set(LLAMA_CURL OFF CACHE BOOL "" FORCE)
          set(LLAMA_SUBPROCESS OFF CACHE BOOL "" FORCE)

          add_subdirectory("${LLAMA_CPP_DIR}" "${CMAKE_BINARY_DIR}/llama.cpp")

          add_library(pocketpal_local SHARED LlamaEngine.cpp)
          target_include_directories(pocketpal_local PRIVATE
            "${LLAMA_CPP_DIR}/include"
            "${LLAMA_CPP_DIR}/common"
            "${LLAMA_CPP_DIR}/ggml/include"
          )
          target_link_libraries(pocketpal_local PRIVATE llama llama-common log)
          EOF

      - name: Configure Capacitor Android project
        run: |
          set -e
          cat >> android/app/build.gradle <<'EOF'

          android {
              ndkVersion "27.2.12479018"
              defaultConfig {
                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }
              externalNativeBuild {
                  cmake {
                      path file("src/main/cpp/CMakeLists.txt")
                      version "3.31.6"
                  }
              }
              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }
          }
          EOF
          sed -i 's/android:label="[^"]*"/android:label="VYRA"/' android/app/src/main/AndroidManifest.xml || true
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vyra-capacitor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
